name: CI

permissions:
  contents: read

on:
  # feature/** matters as much as develop: work here stacks onto an
  # integration branch and merges to develop in one umbrella PR, so a filter
  # of [develop, main] means every stacked PR runs no CI at all until the
  # umbrella lands. A broken Playwright spec sat on an integration branch
  # for days that way.
  pull_request:
    branches: [develop, main, 'feature/**']
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether anything outside docs changed. A job-level `if` on the
  # heavy jobs (not `paths-ignore`) keeps every required check reporting:
  # a skipped job counts as passing. Pushes and manual runs run everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Fail closed: anything but exactly true/false (missing script,
          # crash) fails this step, and the aggregate rejects an empty code.
          # --no-renames lists the old path of a code-to-docs rename too.
          if [ "$EVENT" != "pull_request" ]; then
            CODE=true
          else
            CODE=$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA" | node tools/scripts/ci-changes.mjs)
          fi
          [ "$CODE" = true ] || [ "$CODE" = false ] || { echo "bad filter output: '$CODE'"; exit 1; }
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

  # Always runs, docs included: em-dashes and ROM bytes land in .md too.
  # Node builtins only, so no npm ci.
  content:
    name: Content policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the content-policy check can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Content policy (no ROM-derived bytes)
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ]; then
            BASE=$(git rev-parse HEAD~1 || git rev-parse HEAD)
          fi
          node tools/scripts/check-content.mjs range "$BASE" "${{ github.sha }}"

      # The oracle for the repo migration (issue #678): scans every blob
      # reachable from every ref, not just this push's range. Skipped while
      # the repo is private because the current history still holds known
      # pre-gate offenders that get purged at the public migration, not
      # fixed here - this step is what proves they are gone, once it can
      # run without a guaranteed red build.
      - name: Content policy - full history (public repo only)
        if: ${{ !github.event.repository.private }}
        run: node tools/scripts/check-content.mjs history

  static:
    name: Static checks
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Type-check
        run: npx tsc --noEmit

      # The test tree is not covered by tsconfig.json. Without this the stub's
      # `import type * as vscode` is decoration: it would drift from the real
      # API and nothing would say so until a reader noticed.
      - name: Type-check test stub and provider tests
        run: npx tsc -p tsconfig.test.json

      # 10 webpack configs share one process and sit at the runner's ~2 GB default heap (#617).
      - name: Compile extension
        run: npm run compile
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # No test reads webpack output, so this does not wait on `static`.
  unit:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Exhaustive byte-flip sweeps run 2-4x slower under v8 coverage on Node 22
      # than on Node 20 (same sweep: 14 s vs 47 s on CI), past the 5 s default.
      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage --testTimeout=60000

      # Runs when the tests FAIL too: that is the run worth having. Informational
      # only; Codecov being down never reds CI.
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  # The spike probe servers are throwaway but bind a local port and write
  # files; this proves their /save and GET hardening (stdlib only, no ROM).
  # ubuntu-latest ships python3 >= 3.10, which the servers' annotations need.
  spike:
    name: Spike serve hardening
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 spikes/libretro-view-engine/test_serve_hardening.py

  # The required check "Build & Test" lives on as the gate over the jobs
  # above, so branch protection is unchanged. The verdict is in
  # tools/scripts/ci-aggregate.mjs (fails closed, tested in ciGate.test.ts).
  build-and-test:
    name: Build & Test
    needs: [changes, content, static, unit, spike]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require every job to have passed, or been skipped on a docs-only change
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          CONTENT: ${{ needs.content.result }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          SPIKE: ${{ needs.spike.result }}
        run: node tools/scripts/ci-aggregate.mjs

  # Split out because it needs the Theia workspace installed (~780MB, 734
  # packages) while everything above needs only the root install. Lint and
  # format already cover theia/ from the root job and need no Theia types,
  # so only the TYPE-check is here.
  #
  # The Playwright suite under theia/browser-app/test is deliberately NOT run
  # here. Every spec opens a project from a real cartridge, and a ROM cannot
  # be committed. A job that ran them would skip every assertion and report
  # green, which is the oracle-that-cannot-fail defect. They stay local until
  # CI has a lawful ROM.
  theia-typecheck:
    name: Theia type-check
    needs: changes
    if: needs.changes.outputs.code != 'false'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 22: Theia 1.75 pins Electron 42.8.1,
      # whose engines field requires >= 22.12. Matching it rather than
      # passing --ignore-engines, so a future bump is a visible failure here
      # instead of a suppressed one.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: theia/yarn.lock

      # --ignore-scripts skips the lerna prepare build and Electron's binary
      # download. Type-checking reads .d.ts files from the tarballs and needs
      # neither.
      - name: Install Theia workspace
        run: yarn --cwd theia install --frozen-lockfile --ignore-scripts

      # The extension's tsconfig includes ../../src/rom, which imports
      # @vue/reactivity from the ROOT package. Node resolution walks up to the
      # root node_modules, so type-checking the extension needs both installs.
      - name: Install root dependencies
        run: npm ci

      # Uses the extension's own pinned TypeScript. The root compiler is a
      # later major and rejects the moduleResolution Theia 1.75 requires, so
      # checking with it would be checking the wrong compiler.
      - name: Type-check extension
        run: yarn --cwd theia/extension typecheck

      # The one gate case that needs Theia: its own config-dir resolution
      # must land under Playwright's per-run folder. HB_REQUIRE_THEIA turns
      # the local skip into a failure if the install above is broken.
      - name: Playwright app-data gate against Theia
        run: npx vitest run test/suite/gates/playwrightAppDataGate.test.ts
        env:
          HB_REQUIRE_THEIA: '1'

      # The Maps switch-state store imports Theia's Emitter, so the no-Theia `unit` job skips it;
      # this job installs Theia, and HB_REQUIRE_THEIA turns a broken install into a failure.
      - name: Maps switch-state store against Theia
        run: npx vitest run test/suite/unit/MapViewStateStore.test.ts
        env:
          HB_REQUIRE_THEIA: '1'
