name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the content-policy check can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Content policy (no ROM-derived bytes)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -z "$BASE" ] && BASE=$(git rev-parse HEAD~1 || git rev-parse HEAD)
          bash tools/scripts/check-staged-content.sh range "$BASE" "${{ github.sha }}"

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      # The test tree is not covered by tsconfig.json. Without this the stub's
      # `import type * as vscode` is decoration: it would drift from the real
      # API and nothing would say so until a reader noticed.
      - name: Type-check test stub and provider tests
        run: npx tsc -p tsconfig.test.json

      - name: Compile extension
        run: npm run compile

      - name: Unit tests with coverage
        run: npm run test:unit -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14
