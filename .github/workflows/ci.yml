name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, 'feature/**']
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile extension
        run: npm run compile

      - name: Unit tests
        run: npm run test:unit
