# Arms auto-merge on safe Dependabot PRs: npm patch and minor bumps, one
# commit, no mention of electron anywhere in the diff. Fails closed: any doubt
# disarms the PR and leaves it for a human. Stays manual: majors, github-actions
# updates (they would change CI), anything touching electron, and any PR with
# a human commit, and any PR labeled no-auto-merge. This job holds a write
# token, so it never checks out, installs or runs PR code; it only reads
# metadata and the diff text.
# --auto waits for the required checks (Build & Test, Theia type-check).
name: Dependabot auto-merge

# labeled lets a no-auto-merge label disarm at once. Any label a human adds
# also disarms, because the sender check then fails; that is fail-closed.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions: {}

# A newer push must replace the run for the old head, not race it.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Arm auto-merge
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Commit verification stays on, but it checks only the first commit, so
      # the arm condition also requires exactly one commit.
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Metadata cannot say this: body-parser, multer and fast-uri PRs carry an
      # electron hunk in theia/yarn.lock that dependency-names omits. Broad on
      # purpose; electron-to-chromium churns with browserslist and is exempt.
      # The diff goes to a variable, not a pipe: a gh failure must abort, and
      # grep -q closing a pipe would make sed die and a match read as none.
      - id: electron
        run: |
          set -euo pipefail
          diff="$(gh pr diff "$PR_URL")"
          [ -n "$diff" ]
          stripped="$(sed 's/electron-to-chromium//g' <<<"$diff")"
          if grep -Eiq '^[+-].*electron' <<<"$stripped"; then touched=true; else touched=false; fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"

      # The sender check catches a signed amend that keeps one commit and the
      # author. The label check lets a human hold survive the next rebase,
      # which would otherwise re-arm.
      - id: arm
        if: >-
          github.event.pull_request.commits == 1 &&
          github.event.sender.login == 'dependabot[bot]' &&
          !contains(github.event.pull_request.labels.*.name, 'no-auto-merge') &&
          steps.metadata.outputs.package-ecosystem == 'npm_and_yarn' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor') &&
          steps.electron.outputs.touched == 'false'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL"

      # A PR armed on a patch can be re-pushed with a major or an electron
      # hunk; nothing else would stop it. A failed disarm must show red.
      - if: ${{ !cancelled() && steps.arm.outcome != 'success' }}
        run: |
          armed="$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest != null')"
          if [ "$armed" = true ]; then gh pr merge --disable-auto "$PR_URL"; fi
