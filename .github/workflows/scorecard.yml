# OpenSSF Scorecard: supply-chain checks on the default branch, published to
# scorecard.dev for the README badge and uploaded as code-scanning results.
# Actions are pinned to commit SHAs (Scorecard's Pinned-Dependencies check),
# each a release at least two weeks old when pinned (2026-10-18).
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [develop]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
