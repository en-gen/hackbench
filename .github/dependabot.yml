version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Hold @vue/reactivity at 3.5.32 until pinia ships storeToRefs typings
      # compatible with Vue 3.5.33's dual-generic Ref<Get, Set>. 3.5.33 makes
      # `storeToRefs` over a setup store double-wrap each ref into
      # Ref<Ref<T, T>, Ref<T, T>>, breaking RenderContext consumers.
      - dependency-name: "@vue/reactivity"
        versions: [">=3.5.33"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
