version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: chore
      include: scope
    # No `allow` filter. The extension ships two runtime dependencies; the
    # toolchain that builds and tests it (TypeScript, webpack, ESLint, vitest,
    # @types/vscode) is all devDependencies, so a production-only filter left
    # almost the whole surface unwatched.
    groups:
      # vitest and its plugins pin each other exactly (@vitest/coverage-v8
      # 5.0.2 peers vitest 5.0.2), so separate major bumps can never install.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      typescript-eslint:
        patterns:
          - typescript-eslint
          - "@typescript-eslint/*"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
