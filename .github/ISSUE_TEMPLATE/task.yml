name: Task
description: Tooling, CI, docs, refactors, research and other work that is not product behaviour.
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing?
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checks that prove it is finished.
      placeholder: |
        - `npm run lint` passes with the new rule enabled
    validations:
      required: true
