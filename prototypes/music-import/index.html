<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Music Import Prototype</title>
    <style>
      :root {
        --bg: #1e1e1e;
        --panel: #252526;
        --border: #3a3a3a;
        --text: #cccccc;
        --muted: #888;
        --accent: #007acc;
        --hover: #2d2d2d;
        --selected: #094771;
        --input: #3c3c3c;
        --ok: #4ec9b0;
        --warn: #e0a060;
        --err: #f14c4c;
        --mono: 'Cascadia Mono', Consolas, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font:
          12px/1.4 'Segoe UI',
          system-ui,
          sans-serif;
        color: var(--text);
      }
      body {
        background: var(--bg);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        padding: 8px 12px;
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      header b {
        font-weight: 600;
      }
      button,
      label.btn {
        background: var(--accent);
        border: 0;
        padding: 4px 12px;
        border-radius: 2px;
        cursor: pointer;
        color: #fff;
      }
      button.secondary {
        background: var(--input);
        color: var(--text);
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      select {
        background: var(--input);
        border: 1px solid var(--border);
        padding: 2px 4px;
      }
      .pill {
        display: inline-block;
        padding: 0 6px;
        border-radius: 8px;
        font-size: 11px;
      }
      .ok {
        background: #0f3a33;
        color: var(--ok);
      }
      .err {
        background: #3d1515;
        color: var(--err);
      }
      .warn {
        background: #3d2e12;
        color: var(--warn);
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 320px 1fr;
        min-height: 0;
      }
      aside {
        border-right: 1px solid var(--border);
        background: var(--panel);
        overflow: auto;
      }
      aside h3 {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        padding: 10px 12px 4px;
        font-weight: 600;
      }
      .song {
        display: grid;
        grid-template-columns: 24px 44px 1fr auto;
        gap: 6px;
        align-items: center;
        padding: 4px 12px;
        cursor: pointer;
      }
      .song:hover {
        background: var(--hover);
      }
      .song.sel {
        background: var(--selected);
      }
      .song .play {
        width: 22px;
        height: 22px;
        padding: 0;
        background: transparent;
        color: var(--muted);
        border-radius: 50%;
      }
      .song .play.on {
        color: var(--ok);
      }
      .mono,
      pre {
        font-family: var(--mono);
      }
      .muted {
        color: var(--muted);
      }
      section {
        overflow: auto;
        padding: 14px 18px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 600;
        margin-bottom: 6px;
      }
      pre {
        background: #161616;
        border: 1px solid var(--border);
        padding: 8px 10px;
        overflow: auto;
        font-size: 11.5px;
        max-height: 50vh;
        white-space: pre;
      }
      .notice {
        border-left: 3px solid var(--warn);
        background: #2b2415;
        padding: 8px 12px;
      }
      .notice.err {
        border-color: var(--err);
        background: #2b1616;
      }
      ul.warns li {
        list-style: none;
        padding: 2px 0;
      }
      ul.warns li::before {
        content: '\26A0  ';
        color: var(--warn);
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      dl {
        display: grid;
        grid-template-columns: 110px 1fr;
        gap: 3px 10px;
      }
      dt {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <header>
      <b>Music Import Prototype</b>
      <label class="btn"
        >Choose ROM...<input id="file" type="file" accept=".sfc,.smc,.bin" hidden
      /></label>
      <span id="romInfo" class="muted"
        >Pick any SNES ROM. It is read in the page and never uploaded or copied.</span
      >
      <span style="flex: 1"></span>
      <label class="muted"
        >Command port
        <select id="port">
          <option>0</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
        </select></label
      >
    </header>
    <main>
      <aside id="songs"></aside>
      <section id="detail"><div class="muted">No ROM loaded.</div></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
